<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#181818"><meta name="apple-mobile-web-app-capable" content="yes"><title>PIXEL MOSAIC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181818;color:#eee;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:690px;margin:auto;padding:18px;padding-bottom:max(24px,env(safe-area-inset-bottom))}h1{letter-spacing:.09em;font-size:24px;margin:0 0 4px}p{color:#aaa;font-size:13px;margin:0 0 14px}.stage{background:#242424;border:1px solid #393939;border-radius:12px;min-height:220px;display:grid;place-items:center;overflow:hidden;text-align:center}.stage canvas{display:block;max-width:100%;max-height:49vh;object-fit:contain;width:auto;height:auto}.empty{padding:26px;color:#aaa}.empty svg{display:block;margin:0 auto 14px}button,input,select{font:inherit}button,select{color:#eee;background:#303030;border:1px solid #555;border-radius:10px;padding:11px;min-height:44px}button:disabled{opacity:.35}.bar{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.bar button{flex:1}.picker{position:relative;display:flex;align-items:center;justify-content:center;min-height:49px;background:#eee;color:#181818;border-radius:10px;font-weight:700;margin:12px 0;overflow:hidden}.picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;z-index:1;cursor:pointer}.panel{background:#242424;border-radius:12px;padding:15px;display:grid;gap:13px}.range{display:grid;gap:6px}.range span,.line{display:flex;justify-content:space-between;align-items:center;gap:10px}output{color:#bbb;font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:26px;margin:0;accent-color:#eee}input[type=checkbox]{width:21px;height:21px;accent-color:#ddd}#status{min-height:22px;font-size:13px;color:#c0c0c0;margin:8px 0;overflow-wrap:anywhere}#save{background:#eee;color:#181818;font-weight:700}#exported{width:100%;height:auto;margin:12px 0;border-radius:4px}[hidden]{display:none!important}small{color:#999}
</style></head><body><main><h1>PIXEL MOSAIC</h1><p>Фотография → абстрактная картина</p>
<div class="stage"><div class="empty" id="empty"><svg width="90" height="90" viewBox="0 0 90 90"><path fill="#bbb0a1" d="M0 0h30v30H0zM30 60h30v30H30z"/><path fill="#806d64" d="M30 0h30v30H30zM0 30h30v30H0z"/><path fill="#a6aca3" d="M60 0h30v30H60zM30 30h30v30H30z"/><path fill="#d5c8b8" d="M60 30h30v30H60zM0 60h30v30H0z"/><path fill="#735c62" d="M60 60h30v30H60z"/></svg>Выбери фото из медиатеки</div><canvas id="preview" hidden></canvas></div>
<label class="picker">＋ Выбрать фотографию<input id="file" type="file" accept="image/*" aria-label="Выбрать фотографию"></label>
<div id="status" role="status" aria-live="polite">Фото обрабатываются только на устройстве</div>
<div class="bar"><button id="compare" disabled>Оригинал</button><button id="reset">Сброс</button></div>
<div class="panel">
<label class="range"><span>Квадратов по ширине <output id="no">22</output></span><input id="n" type="range" min="6" max="100" value="22"></label>
<label class="range"><span>Насыщенность <output id="so">75%</output></span><input id="s" type="range" min="0" max="150" value="75"></label>
<label class="range"><span>Яркость <output id="lo">0</output></span><input id="l" type="range" min="-50" max="50" value="0"></label>
<label class="range"><span>Теплота <output id="wo">0</output></span><input id="w" type="range" min="-50" max="50" value="0"></label>
<label class="line">Швы между квадратами<input id="seams" type="checkbox"></label>
<label class="line">Размер PNG<select id="size"><option value="2048">2048 px</option><option value="4096" selected>4096 px</option><option value="8192">8192 px</option></select></label></div>
<div class="bar"><button id="save" disabled>Сохранить PNG</button><button id="share" disabled>Поделиться</button></div>
<div id="exportBox" hidden><small>Если файл не сохранился, удерживай картинку ниже и выбери «Сохранить в Фото».</small><img id="exported" alt="Готовая мозаика"></div>
</main><script>
(function(){
'use strict';
const $=id=>document.getElementById(id), c=$('preview'), src=document.createElement('canvas'), ctx=src.getContext('2d',{willReadFrequently:true});
let data=null, cached=null, original=false, seq=0, frame=0, exportUrl=null;
const clamp=v=>Math.max(0,Math.min(255,Math.round(v)));
const status=t=>$('status').textContent=t;
function labels(){for(const k of ['n','s','l','w'])$(k+'o').textContent=$(k).value+(k==='s'?'%':'')}
function average(n){if(cached&&cached.n===n)return cached;const w=src.width,h=src.height,cell=w/n,rows=Math.ceil(h/cell-1e-8),d=data.data,colors=[];for(let y=0;y<rows;y++){let y0=Math.min(h-1,Math.round(y*cell)),y1=Math.min(h,Math.max(y0+1,Math.round((y+1)*cell)));for(let x=0;x<n;x++){let x0=Math.min(w-1,Math.round(x*cell)),x1=Math.min(w,Math.max(x0+1,Math.round((x+1)*cell))),r=0,g=0,b=0,m=(x1-x0)*(y1-y0);for(let j=y0;j<y1;j++){for(let i=x0;i<x1;i++){let k=(j*w+i)*4;r+=d[k];g+=d[k+1];b+=d[k+2]}}colors.push([r/m,g/m,b/m])}}return cached={n,rows,ratio:h/w,colors}}
function paint(out,max){const n=+$('n').value,a=average(n),s=+$('s').value/100,l=+$('l').value*1.3,t=+$('w').value*.55,ratio=a.ratio;
let tile=Math.max(1,Math.floor(max/Math.max(n,n*ratio)));const maxArea=15000000;tile=Math.min(tile,Math.max(1,Math.floor(Math.sqrt(maxArea/(n*n*ratio)))));out.width=n*tile;out.height=Math.max(1,Math.round(n*tile*ratio));const p=out.getContext('2d');
for(let y=0;y<a.rows;y++)for(let x=0;x<n;x++){let [r,g,b]=a.colors[y*n+x],v=.2126*r+.7152*g+.0722*b;p.fillStyle='rgb('+clamp(v+(r-v)*s+l+t)+','+clamp(v+(g-v)*s+l)+','+clamp(v+(b-v)*s+l-t)+')';p.fillRect(x*tile,y*tile,tile,tile)}
if($('seams').checked){p.strokeStyle='rgba(255,255,255,.22)';p.lineWidth=Math.max(1,tile*.025);p.beginPath();for(let x=1;x<n;x++){p.moveTo(x*tile,0);p.lineTo(x*tile,out.height)}for(let y=1;y<a.rows;y++){p.moveTo(0,y*tile);p.lineTo(out.width,y*tile)}p.stroke()}return a}
function render(){labels();if(!data)return;try{if(original){let q=Math.min(1,1200/Math.max(src.width,src.height));c.width=Math.max(1,Math.round(src.width*q));c.height=Math.max(1,Math.round(src.height*q));c.getContext('2d').drawImage(src,0,0,c.width,c.height);status('Исходная фотография')}else{let a=paint(c,1200);status(a.n+' × '+a.rows+' ячеек')}$('compare').textContent=original?'Мозаика':'Оригинал'}catch(e){status('Ошибка предпросмотра: '+e.message)}}
function read(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error||new Error('Не удалось прочитать файл'));r.readAsDataURL(f)})}
function imageFrom(url){return new Promise((ok,no)=>{let im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error('Формат не распознан'));im.src=url})}
async function decode(f){let u=URL.createObjectURL(f);try{return await imageFrom(u)}catch(e){return await imageFrom(await read(f))}finally{URL.revokeObjectURL(u)}}
$('file').addEventListener('change',async function(){let f=this.files&&this.files[0];if(!f)return;let id=++seq;this.value='';status('Открываю фото…');try{let im=await decode(f);if(id!==seq)return;let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h)throw Error('Пустое изображение');let q=Math.min(1,1800/Math.max(w,h));src.width=Math.max(1,Math.round(w*q));src.height=Math.max(1,Math.round(h*q));ctx.fillStyle='#fff';ctx.fillRect(0,0,src.width,src.height);ctx.drawImage(im,0,0,src.width,src.height);data=ctx.getImageData(0,0,src.width,src.height);cached=null;original=false;$('empty').hidden=true;c.hidden=false;$('compare').disabled=$('save').disabled=$('share').disabled=false;$('exportBox').hidden=true;render()}catch(e){if(id===seq)status('Не удалось открыть фото. Попробуй JPG или PNG. '+e.message)}});
for(const k of ['n','s','l','w','seams'])$(k).addEventListener('input',()=>{original=false;labels();$('exportBox').hidden=true;cancelAnimationFrame(frame);frame=requestAnimationFrame(render)});
$('compare').onclick=()=>{original=!original;render()};$('reset').onclick=()=>{for(const [k,v] of Object.entries({n:22,s:75,l:0,w:0}))$(k).value=v;$('seams').checked=false;original=false;$('exportBox').hidden=true;render()};
function exportImage(){const out=document.createElement('canvas');paint(out,+$('size').value);return new Promise((ok,no)=>{out.toBlob(b=>{const w=out.width,h=out.height;out.width=out.height=1;b?ok({b,w,h}):no(Error('Не удалось создать PNG'))},'image/png')})}
async function save(share){if(!data)return;$('save').disabled=$('share').disabled=true;status('Создаю PNG…');try{let {b,w,h}=await exportImage();if(exportUrl)URL.revokeObjectURL(exportUrl);exportUrl=URL.createObjectURL(b);$('exported').src=exportUrl;$('exportBox').hidden=false;status('PNG · '+w+' × '+h+' px');let f=new File([b],'pixel-mosaic.png',{type:'image/png'});if(share&&navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=exportUrl;a.download='pixel-mosaic.png';document.body.appendChild(a);a.click();a.remove()}catch(e){status('Не удалось сохранить. Выбери меньшее разрешение. '+e.message)}finally{$('save').disabled=$('share').disabled=false}}
$('save').onclick=()=>save(false);$('share').onclick=()=>save(true);
})();
</script></body></html>
