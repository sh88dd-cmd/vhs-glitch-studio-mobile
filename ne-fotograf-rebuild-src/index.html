<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#171717"><title>НЕ ФОТОГРАФ — новая основа</title><style>
*{box-sizing:border-box}body{margin:0;background:#191a1b;color:#fff;font:15px system-ui;overflow:hidden;touch-action:none}canvas#world{display:block;width:100vw;height:100dvh}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:max(16px,env(safe-area-inset-top));left:15px;right:15px;display:flex;justify-content:space-between;align-items:start}strong{font-size:20px;letter-spacing:-1px}b{color:#e8a66a}small{display:block;font-size:10px;letter-spacing:2px}#info{font-size:11px;text-align:right;background:#111a;padding:8px;border-radius:9px}#controls{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;right:16px;display:flex;align-items:end;justify-content:space-between;gap:12px}button{pointer-events:auto;color:#fff;background:#222b;border:1px solid #aaa7;border-radius:13px;padding:13px 16px;font:700 13px system-ui;touch-action:none}button.active,#start,#shot{background:#e9a568;color:#171717}#joy{pointer-events:auto;touch-action:none;width:116px;height:116px;border:1px solid #ffffff60;border-radius:50%;background:#0003;position:relative}#knob{position:absolute;width:44px;height:44px;left:35px;top:35px;background:#fff7;border:1px solid #fff;border-radius:50%;pointer-events:none}#buttons{display:grid;grid-template-columns:repeat(2,auto);gap:8px}#shot{grid-column:span 2}#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#121418bd;gap:15px;padding:24px;text-align:center}#menu h1{font-size:clamp(30px,8vw,55px);margin:0}#status{max-width:500px;line-height:1.5}#photo{display:none;position:fixed;inset:0;background:#111e;align-items:center;justify-content:center;flex-direction:column;gap:12px}#photo img{max-width:96vw;max-height:75dvh;object-fit:contain}#photo a{color:#e9a568}a{color:#ddd}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.5}
</style></head><body><canvas id="world"></canvas><div id="hud"><div id="top"><div><strong>НЕ <b>ФОТОГРАФ</b></strong><small>REBUILD / 0.2</small></div><div id="info">Новая основа</div></div><div id="cross">+</div><div id="controls"><div id="joy"><div id="knob"></div></div><div id="buttons"><button id="view">ВИД: 3</button><button id="run">БЕГ</button><button id="quality">ГРАФИКА</button><button id="audio">ЗВУК</button><button id="shot">◉ КАДР</button></div></div></div><div id="menu"><h1>НЕ <b>ФОТОГРАФ</b></h1><div>Новая тестовая сцена / вечерний двор</div><button id="start" disabled>ЗАГРУЗКА</button><div id="status">Подключение движка</div><a href="./credits.html">Источники и лицензии</a></div><div id="photo"><img id="image"><a id="save" download="ne-fotograf.jpg">Сохранить кадр</a><button id="close">ЗАКРЫТЬ</button></div><script type="module" src="./main.js"></script></body></html>
