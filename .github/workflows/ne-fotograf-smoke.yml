name: NE FOTOGRAF browser smoke test
on:
  push:
    paths:
      - '.github/workflows/ne-fotograf-smoke.yml'
      - 'ne-fotograf/city-v08.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify GLB skeleton and car door
        run: |
          python - <<'PY'
          import json,struct,pathlib
          for name in ['walker.glb','hiker.glb','dog-walker.glb','road-worker.glb','city/real-sedan.glb']:
              b=(pathlib.Path('ne-fotograf/models')/name).read_bytes()
              magic,ver,total,n,typ=struct.unpack_from('<5I',b)
              assert magic==0x46546c67 and ver==2 and total==len(b)
              j=json.loads(b[20:20+n])
              if name.startswith('city/'):
                  assert any(x.get('name')=='door_FL' for x in j['nodes'])
              else:
                  assert j.get('skins')
                  print(name, [x.get('name') for x in j['animations']])
                  print('bones:', [j['nodes'][i].get('name') for i in j['skins'][0]['joints']])
          PY
      - name: Browser runtime check
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m http.server 8765 > /tmp/nf-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://localhost:8765/ne-fotograf/?v=08',{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForFunction(()=>window.NF_TEST!==undefined,{timeout:120000});
              const ready=await page.evaluate(()=>({ready:NF_TEST.ready,error:NF_TEST.error,clips:NF_TEST.clips}));
              if(!ready.ready)throw Error(JSON.stringify(ready));
              console.log('Ready',ready);
              await page.locator('#start').click();
              await page.waitForFunction(()=>window.NF_CITY?.cars>0,{timeout:120000});
              const inspect=()=>page.evaluate(()=>NF_TEST.inspect());
              let state=await inspect();console.log('World',state);
              if(state.places.length!==4||!state.parked.some(c=>c.door))throw Error('Missing entrances or usable car');
              await page.evaluate(()=>{NF_TEST.actor.x=5.75;NF_TEST.actor.z=-13.5;});
              await page.locator('#entry').click();
              if(!(await inspect()).inside)throw Error('Failed enter building');
              await page.locator('#entry').click();
              if((await inspect()).inside)throw Error('Failed exit building');
              await page.evaluate(()=>{NF_TEST.actor.x=-3.55;NF_TEST.actor.z=-18;});
              await page.locator('#carAction').click();
              await page.waitForFunction(()=>NF_TEST.inspect().driving,{timeout:10000});
              await page.waitForTimeout(1000);
              await page.keyboard.down('KeyW');await page.waitForTimeout(1800);await page.keyboard.up('KeyW');
              console.log('Driving',await inspect());
              await page.waitForTimeout(3000);
              await page.locator('#carAction').click();
              await page.waitForFunction(()=>!NF_TEST.inspect().driving,{timeout:10000});
              if(errors.length)throw Error(errors.join('\n'));
              console.log('Smoke test passed');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
