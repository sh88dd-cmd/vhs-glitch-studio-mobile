name: iOS soundtrack extraction regression
on:
  push:
    paths:
      - 'video/audio-extract.js'
      - 'video/film-damage.js'
      - 'video/audio-engine.js'
      - 'video/audio-studio.js'
      - 'video/app.js'
      - 'video/tests/studio-core-smoke.mjs'
      - 'video/tests/status-lights-smoke.mjs'
      - 'video/clean-path.js'
      - 'video/tests/clean-source-smoke.mjs'
      - 'video/camera-osd.js'
      - 'video/tests/camera-cassette-smoke.mjs'
      - 'video/keyframes.js'
      - 'video/tests/frame-tools-smoke.mjs'
      - 'video/player-ui.js'
      - 'video/tests/sticky-monitor-smoke.mjs'
      - 'video/help-content.js'
      - 'video/help-illustrations.js'
      - 'video/help-ui.js'
      - 'video/tests/help-system-smoke.mjs'
      - 'video/styles.css'
      - 'video/index.html'
      - 'video/sw.js'
      - 'video/effects-reset.js'
      - 'video/tests/video-import-smoke.mjs'
      - 'video/tests/hold-audio-offline-smoke.mjs'
      - 'video/tests/audio-extract-smoke.mjs'
      - '.github/workflows/audio-extract-smoke.yml'
  pull_request:
    paths:
      - 'video/audio-extract.js'
      - 'video/film-damage.js'
      - 'video/audio-engine.js'
      - 'video/audio-studio.js'
      - 'video/app.js'
      - 'video/tests/studio-core-smoke.mjs'
      - 'video/tests/status-lights-smoke.mjs'
      - 'video/clean-path.js'
      - 'video/tests/clean-source-smoke.mjs'
      - 'video/camera-osd.js'
      - 'video/tests/camera-cassette-smoke.mjs'
      - 'video/keyframes.js'
      - 'video/tests/frame-tools-smoke.mjs'
      - 'video/player-ui.js'
      - 'video/tests/sticky-monitor-smoke.mjs'
      - 'video/help-content.js'
      - 'video/help-illustrations.js'
      - 'video/help-ui.js'
      - 'video/tests/help-system-smoke.mjs'
      - 'video/styles.css'
      - 'video/index.html'
      - 'video/sw.js'
      - 'video/effects-reset.js'
      - 'video/tests/video-import-smoke.mjs'
      - 'video/tests/hold-audio-offline-smoke.mjs'
      - 'video/tests/audio-extract-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-aac:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check video/audio-extract.js
          node --check video/audio-engine.js
          node --check video/app.js
          node --check video/effects-reset.js
          node --check video/clean-path.js
          node --check video/camera-osd.js
          node --check video/keyframes.js
          node --check video/player-ui.js
          node --check video/help-content.js
          node --check video/help-illustrations.js
          node --check video/help-ui.js
          node --check video/film-damage.js
          node --check video/audio-studio.js
      - name: Verify mini video monitor stays visible at iPhone scroll bottom
        run: node video/tests/sticky-monitor-smoke.mjs
      - name: Test keyframe animation, original comparison, frame stepping and PNG
        run: node video/tests/frame-tools-smoke.mjs
      - name: Test cassette deselection, camera corners and layout collision avoidance
        run: node video/tests/camera-cassette-smoke.mjs
      - name: Test raw original video after reset and lossless export safeguards
        run: node video/tests/clean-source-smoke.mjs
      - name: Check zero-reset, restore-last settings and indicator LEDs
        run: node video/tests/status-lights-smoke.mjs
      - name: Test Safari local video picker and metadata-only fallback
        run: node video/tests/video-import-smoke.mjs
      - name: Test audio/video hold balance and offline mode
        run: node video/tests/hold-audio-offline-smoke.mjs
      - name: Check studio audio mixing and analog film effects
        run: node video/tests/studio-core-smoke.mjs
      - name: Install ffmpeg for MP4/MOV test fixtures (CI only)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Validate every contextual tip and animated offline GIF
        run: node video/tests/help-system-smoke.mjs
      - name: Test AAC extraction from real MP4 and MOV files
        run: node video/tests/audio-extract-smoke.mjs
