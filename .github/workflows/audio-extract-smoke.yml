name: iOS soundtrack extraction regression
on:
  push:
    paths:
      - 'video/audio-extract.js'
      - 'video/film-damage.js'
      - 'video/audio-engine.js'
      - 'video/audio-studio.js'
      - 'video/app.js'
      - 'video/tests/studio-core-smoke.mjs'
      - 'video/tests/status-lights-smoke.mjs'
      - 'video/tests/video-import-smoke.mjs'
      - 'video/tests/hold-audio-offline-smoke.mjs'
      - 'video/tests/audio-extract-smoke.mjs'
      - '.github/workflows/audio-extract-smoke.yml'
  pull_request:
    paths:
      - 'video/audio-extract.js'
      - 'video/film-damage.js'
      - 'video/audio-engine.js'
      - 'video/audio-studio.js'
      - 'video/app.js'
      - 'video/tests/studio-core-smoke.mjs'
      - 'video/tests/status-lights-smoke.mjs'
      - 'video/tests/video-import-smoke.mjs'
      - 'video/tests/hold-audio-offline-smoke.mjs'
      - 'video/tests/audio-extract-smoke.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-aac:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check video/audio-extract.js
          node --check video/audio-engine.js
          node --check video/app.js
          node --check video/film-damage.js
          node --check video/audio-studio.js
      - name: Check active indicator LEDs and all-effects bypass
        run: node video/tests/status-lights-smoke.mjs
      - name: Test Safari local video picker and metadata-only fallback
        run: node video/tests/video-import-smoke.mjs
      - name: Test audio/video hold balance and offline mode
        run: node video/tests/hold-audio-offline-smoke.mjs
      - name: Check studio audio mixing and analog film effects
        run: node video/tests/studio-core-smoke.mjs
      - name: Test AAC extraction from real MP4 and MOV files
        run: node video/tests/audio-extract-smoke.mjs
