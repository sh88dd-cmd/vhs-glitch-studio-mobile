name: Music catalog live smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/music-catalog-live-smoke.yml'
      - 'video/music-catalog.js'
permissions:
  contents: read
jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose direct Hitmos MP3 headers (no media download)
        shell: bash
        run: |
          node <<'NODE'
          const url='https://ru.hitmos.site/get/music/20200910/Prosto_Lera_-_Lyutiki_Remix_70879231.mp3';
          for(const method of ['HEAD']){
            try{
              const r=await fetch(url,{method,redirect:'follow',headers:{Origin:'https://sh88dd-cmd.github.io', 'User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(15000)});
              console.log('HITMOS_DIRECT_MP3',JSON.stringify({http:r.status,finalDomain:new URL(r.url).host,contentType:r.headers.get('content-type'),bytes:r.headers.get('content-length'),cors:r.headers.get('access-control-allow-origin'),disposition:r.headers.get('content-disposition')}));
            }catch(e){console.log('HITMOS_DIRECT_MP3_UNAVAILABLE',String(e));}
          }
          NODE
      - name: Check unofficial HitMoz catalogue API (metadata only)
        shell: bash
        run: |
          node <<'NODE'
          const url='https://bakha.me/hitmoz/search?q=Lyutiki&limit=3';
          try{
            const res=await fetch(url,{headers:{Origin:'https://sh88dd-cmd.github.io',Accept:'application/json'},signal:AbortSignal.timeout(14000)});
            const body=await res.text();let data=null;try{data=JSON.parse(body)}catch{}
            console.log('UNOFFICIAL_HITMOZ_API',JSON.stringify({http:res.status,cors:res.headers.get('access-control-allow-origin'),success:data?.success,count:data?.songs?.length,hasDownload:!!data?.songs?.[0]?.download,hasStream:!!data?.songs?.[0]?.stream}));
          }catch(e){console.log('UNOFFICIAL_HITMOZ_API_ERROR',String(e));}
          NODE
      - name: Test actual Commons catalog parsing, licensing and download CORS
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          const ctx={window:{},URL,fetch,console};
          vm.runInNewContext(fs.readFileSync('video/music-catalog.js','utf8'),ctx);
          const api=ctx.window.VHSVideoMusicCatalog;
          (async()=>{
            for(const genre of ['jazz','ambient']){
              let tracks=[];
              try{
                tracks=await api.searchCommons(genre);
                console.log('ELIGIBLE',genre,tracks.length,tracks.slice(0,5).map(x=>({title:x.title,license:x.license,bytes:x.bytes,url:x.url.slice(0,110)})));
                if(tracks.length){
                  const sample=tracks.find(x=>/\\.(mp3|wav|ogg|oga)(?:$|[?#])/i.test(x.url))||tracks[0];
                  try{
                    const resp=await fetch(sample.url,{method:'HEAD',headers:{Origin:'https://sh88dd-cmd.github.io'},signal:AbortSignal.timeout(14000)});
                    console.log('DIRECT_AUDIO_HEAD',genre,JSON.stringify({status:resp.status,cors:resp.headers.get('access-control-allow-origin'),type:resp.headers.get('content-type'),url:sample.url.slice(0,140)}));
                  }catch(e){console.log('DIRECT_AUDIO_HEAD_ERROR',genre,String(e));}
                }
              }catch(e){console.log('CATALOG_PARSE_ERROR',genre,String(e));}
              if(genre==='jazz'&&!tracks.length)process.exitCode=1;
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Verify official no-key search APIs
        shell: bash
        run: |
          node <<'NODE'
          const urls={
            openverse:'https://api.openverse.org/v1/audio/?q=jazz&page_size=20&category=music&license=cc0%2Cpdm%2Cby',
            commons:'https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=jazz%20filetype%3Aaudio&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url%7Cmime%7Csize%7Cextmetadata&format=json&formatversion=2&origin=*'
          };
          async function probe(name,url){
            try{
              const c=new AbortController();const timer=setTimeout(()=>c.abort(),18000);
              const r=await fetch(url,{signal:c.signal,headers:{Origin:'https://sh88dd-cmd.github.io',Accept:'application/json'}});
              clearTimeout(timer);
              const text=await r.text();let data=null;try{data=JSON.parse(text)}catch{}
              const count=name==='openverse'?(data?.results?.length||0):(data?.query?.pages?.length||0);
              console.log(name,JSON.stringify({http:r.status,cors:r.headers.get('access-control-allow-origin'),matches:count,body:text.slice(0,150)}));
              return r.ok&&!!data;
            }catch(e){console.log(name,'NETWORK_ERROR',String(e));return false;}
          }
          const entries=await Promise.all(Object.entries(urls).map(async ([k,v])=>[k,await probe(k,v)]));
          const ok=entries.some(([k,v])=>v);
          console.log('AT_LEAST_ONE_CATALOG_REACHABLE',ok,'(runner network; Safari must be tested separately)');
          if(!ok)process.exitCode=1;
          NODE
