name: NE FOTOGRAF safe startup test
on:
  push:
    paths:
      - '.github/workflows/ne-fotograf-safe-start.yml'
      - 'ne-fotograf/city-v093.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test safe start without character downloads
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python -m http.server 8765 >/tmp/nf-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try{
              const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
              const errors=[],downloads=[];page.on('pageerror',e=>errors.push(e.message));page.on('request',r=>{if(/\/models\/(ara\/|ara-ktx\/|Nudgirl1)/.test(r.url())&&r.url().endsWith('.glb'))downloads.push(r.url())});
              await page.addInitScript(()=>localStorage.setItem('nf093-pending-asset','hero'));
              await page.goto('http://localhost:8765/ne-fotograf/?v=093',{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForFunction(()=>window.NF_TEST?.ready,null,{timeout:90000});
              if(downloads.length)throw Error('Character fetched before start');
              await page.locator('#start').click();
              await page.waitForFunction(()=>window.NF_TEST.inspect().started,null,{timeout:15000});
              await page.keyboard.down('KeyW');await page.waitForTimeout(1500);await page.keyboard.up('KeyW');
              const state=await page.evaluate(()=>({world:NF_TEST.inspect(),z:NF_TEST.actor.z}));
              console.log(state);
              if(state.world.view!==1||state.world.hero||state.z<=-22||downloads.length||errors.length)throw Error(JSON.stringify({state,downloads,errors}));
              console.log('Safe startup and movement passed');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
