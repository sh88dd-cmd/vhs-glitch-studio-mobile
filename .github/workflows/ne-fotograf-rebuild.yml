name: NE FOTOGRAF rebuild 07
on:
  push:
    paths:
      - 'ne-fotograf-rebuild-src/**'
      - '.github/workflows/ne-fotograf-rebuild.yml'
  workflow_dispatch:
    inputs:
      release_verified:
        description: 'Release only after visual reference review of candidate'
        type: boolean
        default: false
concurrency:
  group: ne-fotograf-rebuild-publication
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned licensed assets
        working-directory: ne-fotograf-rebuild-src
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,struct
          sources=json.load(open('assets-sources.json'))
          for name,url in sources.items():
              p=pathlib.Path('public/assets')/name
              p.parent.mkdir(parents=True,exist_ok=True)
              existing=pathlib.Path('../ne-fotograf-next/assets')/name
              if existing.is_file():
                  import shutil
                  shutil.copyfile(existing,p)
              else:
                  subprocess.run(['curl','-fL','--retry','2','--max-time','90',url,'-o',str(p)],check=True)
              if name.endswith('.glb'):
                  b=p.read_bytes()
                  magic,version,total,n,typ=struct.unpack_from('<5I',b)
                  assert magic==0x46546c67 and version==2 and total==len(b)
                  d=json.loads(b[20:20+n])
                  if '/anims_' in name:
                      assert {'idle_relaxed','walk','dash','select_idle'}.issubset({a['name'] for a in d['animations']})
                  elif name.startswith('people/'):
                      assert d.get('skins') and d.get('meshes')
              print(name,p.stat().st_size,flush=True)
          PY
      - name: Bake actual OpenStreetMap data
        working-directory: ne-fotograf-rebuild-src
        run: |
          if python -c "import json; assert json.load(open('../ne-fotograf-next/assets/kitay-gorod.json')).get('districtExtent')==5" 2>/dev/null; then
            cp ../ne-fotograf-next/assets/kitay-gorod.json public/assets/kitay-gorod.json
          else
            python tools/expand-osm.py
          fi
          mkdir -p public/assets/cars
          cp ../ne-fotograf/models/city/real-{sedan,suv,hatchback}.glb public/assets/cars/
          cp ../ne-fotograf/models/city/plane-tree.glb public/assets/props/plane-tree.glb
          cp ../ne-fotograf/icon-192.png public/icon-192.png
      - name: Read real building parts and mapped street details
        working-directory: ne-fotograf-rebuild-src
        run: |
          python -m pip install --quiet shapely
          if ! python -c "import json; assert json.load(open('public/assets/kitay-gorod.json')).get('detailDataVersion')==1"; then python tools/enrich-osm.py; fi
      - name: Prepare licensed rectified facade photo assets
        working-directory: ne-fotograf-rebuild-src
        run: |
          python -m pip install --quiet pillow numpy opencv-python-headless
          python tools/bake-photo-facades.py
      - name: Build independent engine
        working-directory: ne-fotograf-rebuild-src
        run: |
          npm install --no-audit --no-fund
          mkdir -p public/assets/decoders/{draco,basis}
          cp -a node_modules/three/examples/jsm/libs/draco/gltf/. public/assets/decoders/draco/
          cp -a node_modules/three/examples/jsm/libs/basis/. public/assets/decoders/basis/
          npm run build
          npx playwright install --with-deps chromium
      - name: Test new characters, movement and camera before publishing
        working-directory: ne-fotograf-rebuild-src
        run: |
          python -m http.server 8765 --directory dist >/tmp/nf-rebuild-http.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'});
            const errors=[];page.on('pageerror',e=>{errors.push(e.message);console.log(e.message)});page.on('console',m=>{if(m.type()==='error')console.log(m.text())});
            await page.goto('http://localhost:8765/?test=1',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.NF_NEW!==undefined,null,{timeout:90000});
            let state=await page.evaluate(()=>NF_NEW.ready?NF_NEW.inspect():NF_NEW);
            console.log('Before',state);
            if(state.hero!=='Andr 3-rigged'||state.heroVertices!==122663||state.heroSkinned<1||state.people!==5||state.view!==3||state.quality!==1||state.mapSource!=='OpenStreetMap'||state.relationBuildings<1||state.buildings<150||state.roads<150||state.locations.length<7||!state.actions.includes('jumpStart')||!state.actions.includes('jumpLoop')||!state.actions.includes('run'))throw Error(JSON.stringify(state));
            if(state.mapHandedness>=0||state.waterPolygons<1||!state.locations.includes('Высотка на Котельнической'))throw Error('Geographic correction/extent '+JSON.stringify(state));
            if(state.district?.amphitheaterRows!==18||state.district?.parkGround?.height<5||state.district?.canopyTriangles<500)throw Error('Zaryadye topography and canopy missing '+JSON.stringify(state.district));
            if(!state.district?.kotelnicheskaya||!state.district?.plevna||!state.district?.cyrilMethodius||!state.district?.hall||!state.district?.bridge||state.district.parkTrees<12||state.district.streetLamps<8||state.district.streets.length<3)throw Error('District environment missing '+JSON.stringify(state.district));
            if(state.surveyedFacades<9)throw Error('Missing municipal elevations '+JSON.stringify(state));
            if(state.lubyanskyElevations!==8)throw Error('Missing Lubyansky measured lower elevations '+state.lubyanskyElevations);
            if(state.heritageFacades!==3)throw Error('Missing individually modeled heritage buildings');
            if(state.mapped.parts<20||state.mapped.taggedTrees<10||state.mapped.surfaces<10)throw Error('Missing actual mapped detail '+JSON.stringify(state.mapped));
            if(state.photoFacades<7||state.photoAvailable<7||state.district.ilyinskyTrees<10)throw Error('Photo/park coverage '+JSON.stringify(state));
            if(state.baseFacades!==state.buildings||state.addressProfiles<55||state.profileTypes.length<20)throw Error('District coverage '+JSON.stringify(state));
            if(!state.piggyAddressMatched||!state.landmarks.includes('piggy'))throw Error('Piggy facade missing '+JSON.stringify(state.piggyInfo));
            if(state.cars.length!==4||!state.cars.every(c=>c.clear&&c.dir*c.lane<0)||state.pedestrians.length!==4||!state.pedestrians.every(p=>p.clear&&p.path>2))throw Error('Traffic or sidewalk init '+JSON.stringify(state));
            await page.locator('#start').click();
            await page.waitForFunction(()=>NF_NEW.inspect().simSteps>=5,null,{timeout:90000,polling:100});
            writeFileSync('/tmp/nf-hero.png',Buffer.from((await page.evaluate(()=>NF_NEW.capture())).split(',')[1],'base64'));
            // Test equal amounts of simulation time even on slow software WebGL.
            async function hold(key,steps){
              const start=await page.evaluate(()=>NF_NEW.inspect().simSteps);
              await page.keyboard.down(key);
              try{await page.waitForFunction(({start,steps})=>NF_NEW.inspect().simSteps>=start+steps,{start,steps},{timeout:90000,polling:100})}
              finally{await page.keyboard.up(key)}
              return await page.evaluate(()=>NF_NEW.inspect().position);
            }
            function grounded(s){if(Math.abs(s.position[1])>.05||Math.abs(s.bodyY-.905)>.01||s.cameraY<1.4||s.groundY!==0)throw Error('Ground regression '+JSON.stringify(s))}
            grounded(await page.evaluate(()=>NF_NEW.inspect()));
            await page.waitForFunction(()=>NF_NEW.inspect().simSteps>=30,null,{timeout:90000,polling:100});
            grounded(await page.evaluate(()=>NF_NEW.inspect()));
            await page.locator('#jump').click();
            await page.waitForFunction(()=>NF_NEW.inspect().jumpPeak>.2,null,{timeout:90000,polling:100});
            await page.waitForFunction(()=>NF_NEW.inspect().jumpH===0,null,{timeout:90000,polling:100});
            grounded(await page.evaluate(()=>NF_NEW.inspect()));
            const forward=await hold('KeyW',60);
            grounded(await page.evaluate(()=>NF_NEW.inspect()));
            if(forward[2]<=-13.8)throw Error('Forward direction: '+JSON.stringify(forward));
            const beforeRight=await page.evaluate(()=>NF_NEW.inspect().position);
            const afterRight=await hold('KeyD',35);
            if(afterRight[0]>=beforeRight[0]-.10)throw Error('Right direction: '+JSON.stringify({beforeRight,afterRight}));
            const afterLeft=await hold('KeyA',50);
            if(afterLeft[0]<=afterRight[0]+.10)throw Error('Left direction: '+JSON.stringify({afterRight,afterLeft}));
            await page.locator('#view').click();
            if((await page.evaluate(()=>NF_NEW.inspect())).view!==1)throw Error('view 1');
            await page.locator('#view').click();
            state=await page.evaluate(()=>NF_NEW.inspect());grounded(state);console.log('After',state);
            if(state.view!==3||state.position[2]<=-13.8||errors.length)throw Error(JSON.stringify({state,errors}));
            if(state.staticBefore>100&&state.staticAfter>=state.staticBefore*.65)throw Error('Static batching insufficient: '+JSON.stringify(state));
            if(await page.locator('#quality').count()!==0||await page.locator('#update').count()!==1||await page.locator('#buttons').evaluate(e=>e.getBoundingClientRect().width)>170)throw Error('UI');
            if(!state.cars.some(c=>c.travel>.2)||!state.cars.every(c=>c.clear)||!state.pedestrians.every(p=>p.clear))throw Error('Traffic movement or blocked sidewalk '+JSON.stringify(state));
            if(!await page.evaluate(()=>NF_NEW.test.nearCar('parked-sedan')))throw Error('No parked vehicle access');
            await page.locator('#carAction').click({timeout:15000});
            const entered=await page.evaluate(()=>NF_NEW.inspect());
            if(entered.driving!=='parked-sedan')throw Error('Enter car '+JSON.stringify(entered));
            const carStart=entered.position;
            await hold('KeyW',95);
            const moving=await page.evaluate(()=>NF_NEW.inspect());
            if(Math.hypot(moving.position[0]-carStart[0],moving.position[2]-carStart[2])<1.0)throw Error('Drive '+JSON.stringify(moving));
            await page.waitForFunction(()=>Math.abs(NF_NEW.inspect().driveSpeed)<.4,null,{timeout:90000,polling:100});
            await page.locator('#carAction').click({timeout:15000});
            const exited=await page.evaluate(()=>NF_NEW.inspect());grounded(exited);
            if(exited.driving||errors.length)throw Error('Exit '+JSON.stringify({exited,errors}));
            if(!await page.evaluate(()=>NF_NEW.test.nearCar('real-suv')))throw Error('No occupied vehicle access');
            await page.locator('#carAction').click({timeout:15000});
            const stolen=await page.evaluate(()=>NF_NEW.inspect());if(!['real-sedan','real-suv','real-hatchback'].includes(stolen.driving)||stolen.ejections!==1)throw Error('Takeover '+JSON.stringify(stolen));
            await page.locator('#carAction').click({timeout:15000});
            await page.locator('#places').click();
            if(!await page.locator('#fullMap').isVisible())throw Error('Map UI');
            if(!await page.evaluate(()=>NF_NEW.test.route()))throw Error('No walking route to Maroseyka');
            await page.locator('#teleports').click();
            await page.locator('#placeList button').filter({hasText:'Маросейка'}).click();
            const visited=await page.evaluate(()=>NF_NEW.inspect());if(visited.driving||Math.hypot(visited.position[0],visited.position[2]+14)<40||errors.length)throw Error('Location '+JSON.stringify(visited));
            const frame=await page.evaluate(()=>NF_NEW.capture());
            writeFileSync('/tmp/nf-piggy.png',Buffer.from((await page.evaluate(()=>NF_NEW.test.capturePiggy())).split(',')[1],'base64'));
            for(const [name,file] of [['Солянка','solyanka'],['Маросейка','maroseyka'],['Лубянский проезд','lubyansky'],['Зарядье','zaryadye'],['Славянская площадь','slavyanskaya'],['Ильинский сквер','ilyinsky'],['Высотка на Котельнической','kotelnicheskaya'],['Старый Английский двор','english-court'],['Палаты бояр Романовых','romanov']]){
              const image=await page.evaluate(name=>NF_NEW.test.captureStreet(name),name);
              writeFileSync('/tmp/nf-'+file+'.png',Buffer.from(image.split(',')[1],'base64'));
            }
            writeFileSync('/tmp/nf-architecture-audit.json',JSON.stringify(await page.evaluate(()=>NF_NEW.inspect()),null,2));
            writeFileSync('/tmp/nf-rebuild.png',Buffer.from(frame.split(',')[1],'base64'));
            await page.screenshot({path:'/tmp/nf-screen.png'});
          }finally{await browser.close()}
          JS
      - name: Verify actual rendered image
        run: |
          python -m pip install pillow --quiet
          python - <<'PY'
          from PIL import Image,ImageStat
          im=Image.open('/tmp/nf-rebuild.png').convert('RGB')
          st=ImageStat.Stat(im)
          print('Render mean:',st.mean,'std:',st.stddev)
          assert max(st.mean)>30 and max(st.stddev)>18, 'Empty or uniform WebGL render'
          assert len(im.resize((96,96)).getcolors(10000))>150, 'Missing visual detail'
          for name in ('piggy','solyanka','maroseyka','lubyansky','zaryadye','slavyanskaya','ilyinsky','kotelnicheskaya','english-court','romanov'):
              img=Image.open('/tmp/nf-'+name+'.png').convert('RGB')
              assert max(ImageStat.Stat(img).stddev)>12, 'Blank district screenshot '+name
          PY
      - name: Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-preview
          path: |
            /tmp/nf-rebuild.png
            /tmp/nf-hero.png
            /tmp/nf-piggy.png
            /tmp/nf-solyanka.png
            /tmp/nf-maroseyka.png
            /tmp/nf-lubyansky.png
            /tmp/nf-zaryadye.png
            /tmp/nf-slavyanskaya.png
            /tmp/nf-ilyinsky.png
            /tmp/nf-kotelnicheskaya.png
            /tmp/nf-english-court.png
            /tmp/nf-romanov.png
            /tmp/nf-architecture-audit.json
      - name: Publish new scene separately
        if: github.event_name == 'workflow_dispatch' && inputs.release_verified == true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/tested-dist"
          cp -a ne-fotograf-rebuild-src/dist/. "$RUNNER_TEMP/tested-dist/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- ne-fotograf-rebuild-src .github/workflows/ne-fotograf-rebuild.yml; then
              echo 'Source changed since build: refusing stale publication'
              exit 1
            fi
            git reset --hard origin/main
            mkdir -p ne-fotograf-next
            cp -a "$RUNNER_TEMP/tested-dist/." ne-fotograf-next/
            git add ne-fotograf-next
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish independently tested NE FOTOGRAF rebuild'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
