name: Bundle local face AI and Russian handwritten fonts
on:
  push:
    paths:
      - '.github/workflows/vendor-photo-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor-photo-ai-assets
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned MediaPipe browser runtime locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/face/wasm assets/fonts /tmp/vision-package
          npm pack @mediapipe/tasks-vision@0.10.22 --pack-destination /tmp/vision-package --silent
          tar -xzf /tmp/vision-package/mediapipe-tasks-vision-0.10.22.tgz -C /tmp/vision-package
          cp /tmp/vision-package/package/vision_bundle.mjs assets/face/vision_bundle.mjs
          cp /tmp/vision-package/package/wasm/vision_wasm_internal* assets/face/wasm/
          test -s assets/face/vision_bundle.mjs
          test -s assets/face/wasm/vision_wasm_internal.wasm
          curl --fail --location --retry 3 --silent --show-error \
            'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' \
            --output assets/face/blaze_face_short_range.tflite
          test "$(wc -c < assets/face/blaze_face_short_range.tflite)" -gt 10000
          ls -lh assets/face/ assets/face/wasm/
      - name: Add six original open-source Cyrillic handwriting fonts
        shell: bash
        run: |
          set -euo pipefail
          origin='https://raw.githubusercontent.com/google/fonts/main/ofl'
          curl -fL --retry 3 -sS "$origin/caveat/Caveat%5Bwght%5D.ttf" -o assets/fonts/Caveat.ttf
          curl -fL --retry 3 -sS "$origin/badscript/BadScript-Regular.ttf" -o assets/fonts/BadScript.ttf
          curl -fL --retry 3 -sS "$origin/marckscript/MarckScript-Regular.ttf" -o assets/fonts/MarckScript.ttf
          curl -fL --retry 3 -sS "$origin/neucha/Neucha.ttf" -o assets/fonts/Neucha.ttf
          curl -fL --retry 3 -sS "$origin/pangolin/Pangolin-Regular.ttf" -o assets/fonts/Pangolin.ttf
          curl -fL --retry 3 -sS "$origin/pacifico/Pacifico-Regular.ttf" -o assets/fonts/Pacifico.ttf
          for name in caveat badscript marckscript neucha pangolin pacifico; do
            curl -fL --retry 3 -sS "$origin/$name/OFL.txt" -o "assets/fonts/LICENSE-$name.txt"
          done
          for font in assets/fonts/*.ttf; do test "$(wc -c < "$font")" -gt 30000; done
          ls -lh assets/fonts/
      - name: Commit bundled local assets to the same repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/face assets/fonts
          if git diff --cached --quiet; then
            echo 'Assets already exist at pinned versions.'
            exit 0
          fi
          git commit -m 'Bundle offline face model, MediaPipe wasm and six licensed Cyrillic handwritten fonts'
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "Retry push: $attempt"
            sleep 2
            git pull --rebase origin main
          done
          exit 1
