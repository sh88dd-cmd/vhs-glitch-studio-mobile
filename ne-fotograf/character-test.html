<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>НЕ ФОТОГРАФ — технический тест модели</title><style>
*{box-sizing:border-box}body{margin:0;background:#1c2024;color:#fff;font:15px system-ui;padding: max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}main{max-width:800px;margin:auto}a{color:#ffbc91}h1{font-size:21px;margin:12px 0}p{font-size:13px;line-height:1.4;color:#ccc}#cv{width:100%;height:clamp(230px,53dvh,520px);display:block;border-radius:12px;background:#30363a;touch-action:none}label,button{display:inline-flex;justify-content:center;align-items:center;min-height:44px;border:0;border-radius:9px;background:#363b40;color:white;padding:9px;font:700 14px system-ui;touch-action:manipulation}label{background:#ef9c65;color:#151515;width:100%;cursor:pointer}input{position:absolute;opacity:0;width:1px;height:1px}.row{display:flex;gap:6px;margin:8px 0}.row button{flex:1}button:disabled{opacity:.4}.on{background:#ef9c65;color:#151515}#status{overflow-wrap:anywhere;white-space:pre-wrap;min-height:36px}</style></head><body><main><a href="./">← В игру</a><h1>Технический тест персонажа</h1><label for="file">ВЫБРАТЬ ГОТОВЫЙ GLB</label><input id="file" type="file" accept=".glb,model/gltf-binary,application/octet-stream"><p id="status">Загрузка движка…</p><canvas id="cv"></canvas><div class="row"><button data-clip="Idle" disabled>СТОЯНИЕ</button><button data-clip="Walk" disabled>ХОДЬБА</button><button data-clip="Run" disabled>БЕГ</button></div><div class="row"><button id="view">КАМЕРА: СЗАДИ</button><button id="reset">СБРОС</button></div><p>Свайп по сцене — поворот камеры. Проверка на нейтральной площадке. Файл читается на устройстве и не публикуется.</p></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
const $=id=>document.getElementById(id),cv=$('cv'),status=$('status'),buttons=[...document.querySelectorAll('[data-clip]')];const scene=new T.Scene();scene.background=new T.Color(0x89939b);scene.fog=new T.Fog(0x89939b,12,36);const renderer=new T.WebGLRenderer({canvas:cv,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;const cam=new T.PerspectiveCamera(55,1,.03,50);scene.add(new T.HemisphereLight(0xe7edff,0x62646a,2));const sun=new T.DirectionalLight(0xffedcf,2.7);sun.position.set(-3,6,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:.2,far:25});scene.add(sun);const ground=new T.Mesh(new T.PlaneGeometry(65,65),new T.MeshStandardMaterial({color:0x777b79,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new T.GridHelper(65,65,0x5b6061,0x666a6a);grid.position.y=.004;scene.add(grid);const actor=new T.Group();scene.add(actor);let root,mixer,action,clips={},mode='Idle',yaw=Math.PI,front=false,last=performance.now(),busy=false;const draco=new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');const loader=new GLTFLoader().setDRACOLoader(draco);
function play(name){if(!clips[name]||!mixer)return;let next=mixer.clipAction(clips[name]);if(next!==action){next.reset().play();if(action)action.crossFadeTo(next,.18,false);action=next}mode=name;buttons.forEach(b=>b.classList.toggle('on',b.dataset.clip===name))}
buttons.forEach(b=>b.onclick=()=>play(b.dataset.clip));$('view').onclick=()=>{front=!front;yaw=front?0:Math.PI;$('view').textContent='КАМЕРА: '+(front?'СПЕРЕДИ':'СЗАДИ')};$('reset').onclick=()=>{actor.position.set(0,0,0);play('Idle')};function resize(){let w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}new ResizeObserver(resize).observe(cv);resize();
let drag;cv.onpointerdown=e=>{drag={id:e.pointerId,x:e.clientX};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(drag?.id===e.pointerId){yaw-=(e.clientX-drag.x)*.012;drag.x=e.clientX}};cv.onpointerup=cv.onpointercancel=()=>drag=null;
function frame(t){requestAnimationFrame(frame);let dt=Math.min(.045,(t-last)/1000);last=t;mixer?.update(dt);if(mode!=='Idle'&&root){actor.position.z+=dt*(mode==='Run'?3.9:1.55);if(actor.position.z>13)actor.position.z=-13}sun.target.position.copy(actor.position);sun.position.set(actor.position.x-3,6,actor.position.z+4);if(!sun.target.parent)scene.add(sun.target);cam.position.set(actor.position.x+Math.sin(yaw)*3.7,2.0,actor.position.z+Math.cos(yaw)*3.7);cam.lookAt(actor.position.x,.95,actor.position.z);renderer.render(scene,cam)}requestAnimationFrame(frame);
$('file').onchange=async()=>{if(busy||!$('file').files.length)return;busy=true;buttons.forEach(b=>b.disabled=true);try{status.textContent='Чтение GLB…';const b=await $('file').files[0].arrayBuffer();if(new DataView(b).getUint32(0,true)!==0x46546c67)throw Error('Неверный формат');const g=await loader.parseAsync(b,'');let skins=0,bones=0;g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}if(o.isSkinnedMesh){skins++;bones=Math.max(bones,o.skeleton.bones.length)}});if(!skins)throw Error('Скелет отсутствует');let found={};for(const c of g.animations){for(const name of ['Idle','Walk','Run'])if(c.name.toLowerCase().endsWith(name.toLowerCase()))found[name]=c}if(Object.keys(found).length!==3)throw Error('Не найдены все три анимации');g.scene.updateMatrixWorld(true);const box=new T.Box3().setFromObject(g.scene),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());if(!Number.isFinite(size.y)||size.y<.001)throw Error('Неверные размеры');let k=1.75/size.y;g.scene.scale.multiplyScalar(k);g.scene.position.multiplyScalar(k).sub(new T.Vector3(center.x,box.min.y,center.z).multiplyScalar(k));if(root){mixer?.stopAllAction();actor.remove(root)}root=g.scene;actor.add(root);actor.position.set(0,0,0);mixer=new T.AnimationMixer(root);clips=found;action=null;play('Idle');buttons.forEach(b=>b.disabled=false);status.textContent='Загружено: '+bones+' костей, '+skins+' частей со скелетом. Idle / Walk / Run готовы к проверке.'}catch(e){status.textContent='Ошибка: '+e.message;console.error(e)}finally{busy=false}};
status.textContent='Выбери GLB со скелетом и анимациями.';</script></body></html>
